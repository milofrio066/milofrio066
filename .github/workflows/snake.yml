name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7b5cff&color_dots=#ebedf0,#c7c2ff,#9d8cff,#7b5cff,#00b8d4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#0a0d1f,#1b1f4a,#3b2f8f,#7b5cff,#ff3df2

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
