<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214" fill="none">
<style>
text{font-family:'Segoe UI','Inter',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,ui-monospace,monospace}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="594" height="98" rx="12" fill="#0a0d1f" stroke="#1c2347" stroke-width="2"/>
